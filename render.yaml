# Render Blueprint for the Express API.
# In Render: New -> Blueprint -> connect this repository.
# Set DATABASE_URL and FRONTEND_URL in the dashboard; they are marked sync:false
# so Render prompts for them instead of storing secrets in this file.
services:
  - type: web
    name: expense-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
